# A missing asset must never be cached: during a deploy the edge can ask for a
# chunk before the new container is up, and a cached 404 keeps the app broken
# long after the deploy finished.
error_page 404 = @not_found;

location @not_found {
    add_header Cache-Control "no-store" always;
    return 404;
}

# index.html references hash-named assets, so it must never be cached:
# a stale copy asks for chunks the current build no longer ships.
location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

# Hash-named build output: the name changes whenever the content changes.
location ~ "-[A-Z0-9]{8}\.(?:js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Remaining static files. Without =404 a missing asset falls back to
# index.html and gets cached as HTML under a .js/.css URL.
location ~* \.(?:js|mjs|css|map|json|txt|webmanifest|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot|otf)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
}
