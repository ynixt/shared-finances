<app-paged-select
  #pagedSelect
  [optionsGetter]="optionsGetter()"
  [placeholder]="placeholder()"
  [showClear]="showClear()"
  [ngModel]="value"
  (ngModelChange)="onValueChange($event)"
>
  <ng-template let-item #item>
    <app-wallet-item-option [item]="item" />
  </ng-template>

  <ng-template let-item #selectedItem>
    <app-wallet-item-option [item]="item" mode="selected" />
  </ng-template>
</app-paged-select>
