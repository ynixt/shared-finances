legal:
  viewPlans: Ver os planos e limites atuais
  terms:
    title: Termos de Uso
    p1: >-
      Estes Termos de Uso regem o acesso e o uso do Shared Finances. O serviço é operado com jurisdição
      no Brasil. Ao criar uma conta enquanto estes documentos são apresentados, você concorda com
      estes termos.
    p2: >-
      Você é responsável pela veracidade das informações que fornecer e pela proteção das suas
      credenciais. Não deve usar o serviço de forma indevida, tentar acesso não autorizado ou
      interferir na operação normal da plataforma.
    p3: >-
      Você pode encerrar sua conta. A exclusão remove permanentemente a conta e os registros financeiros
      associados a ela, ressalvada qualquer retenção exigida pela legislação aplicável.
    p4: >-
      Excluir uma conta também exclui todos os grupos dos quais ela é proprietária e os registros
      financeiros desses grupos, inclusive um grupo que ainda tenha ou seja usado por outros membros.
      Transfira ou preserve o que esses membros precisarem antes de excluir a conta proprietária.
    p5: >-
      Uma conta sem uso pode ser excluída após o período de inatividade configurado para seu plano.
      Enviamos aviso prévio por e-mail antes da exclusão por inatividade para que a pessoa possa voltar
      ou preservar o que precisar.
    p6: >-
      Contas e grupos podem ter limites conforme o plano. Os limites atuais são publicados separadamente
      e lidos das mesmas configurações aplicadas pelo serviço.
    p7: >-
      O Shared Finances é um software de código aberto. Operadores podem executar e adaptar sua própria
      instância conforme a licença do projeto e são responsáveis pelas políticas e documentos que
      apresentarem nela.
    p8: >-
      Uma instância hospedada pelo próprio operador não está sujeita aos limites desta instância pública;
      seu operador decide quais limites, se houver, serão aplicados.
    p9: >-
      Infraestrutura: o tráfego pode passar pela Cloudflare, que pode oferecer proxy, cache, proteções
      de segurança e analytics próprios, conforme a documentação da Cloudflare para os recursos
      habilitados na nossa configuração.
    p10: >-
      O aplicativo não utiliza Google Analytics nem soluções similares de analytics de terceiros na
      interface do produto. Podemos introduzir métricas operacionais estritamente agregadas e anônimas
      para manter a confiabilidade do serviço; se isso ocorrer, descreveremos na Política de Privacidade.
    p11: >-
      Para solicitações relacionadas à privacidade sob a LGPD, contate lgdp-finances@gabrielsilva.dev.
    p12: >-
      Reservamo-nos o direito de suspender ou excluir contas que violem nossa política de uso justo ou
      estes Termos de Uso, inclusive em casos de abuso, fraude ou atividade que comprometa o serviço ou
      outros usuários, a nosso critério e quando permitido pela legislação aplicável.
    p13: >-
      Proteção contra bots: cadastro, login e solicitações de recuperação de senha podem passar pelo
      Cloudflare Turnstile. O Turnstile pode coletar sinais técnicos limitados para distinguir humanos
      de tráfego automatizado; consulte a documentação da Cloudflare sobre o tratamento desses dados.
  privacy:
    title: Política de Privacidade
    p1: >-
      Esta Política de Privacidade explica como o Shared Finances trata dados pessoais quando você usa
      o serviço. Aplica-se a usuários em todos os idiomas suportados e está alinhada à nossa operação
      no Brasil (LGPD).
    p2: >-
      Tratamos dados que você informa, incluindo dados de conta, perfil e informações financeiras, e
      dados técnicos necessários para autenticação e segurança, como endereço IP e user agent do navegador.
    p3: >-
      Sessões autenticadas e refresh tokens são armazenados com retenção limitada no tempo, inclusive
      em Redis com TTL, para que metadados relacionados não permaneçam além dos tempos configurados.
    p4: >-
      Você pode solicitar ou realizar a exclusão da conta. A exclusão remove permanentemente o perfil e
      os registros financeiros, ressalvada qualquer retenção exigida pela legislação aplicável.
    p5: >-
      A exclusão da conta também remove todos os grupos dos quais ela é proprietária e os registros
      financeiros desses grupos, inclusive grupos com outros membros. Esses membros perdem o acesso
      aos dados do grupo excluído.
    p6: >-
      Uma conta sem uso pode ser excluída após o período de inatividade configurado para seu plano. Um
      aviso prévio é enviado ao e-mail da conta antes dessa exclusão.
    p7: >-
      Configurações de plano e cota determinam algumas regras de retenção e uso. Seus limites atuais são
      publicados separadamente e lidos das mesmas configurações aplicadas pelo serviço.
    p8: >-
      O tráfego pode ser encaminhado pela Cloudflare, que pode atuar como proxy reverso e oferecer cache,
      segurança e processamentos relacionados. Dependendo da configuração, a Cloudflare pode tratar
      dados técnicos para essas finalidades; consulte os avisos para os recursos em uso.
    p9: >-
      Não utilizamos Google Analytics nem scripts similares de analytics de terceiros dentro do
      aplicativo. Podemos futuramente coletar métricas operacionais estritamente agregadas e anônimas
      que não identifiquem você; se forem introduzidas, atualizaremos esta política.
    p10: >-
      Você pode exercer direitos previstos na LGPD, como acesso ou exclusão quando aplicável, contatando
      lgdp-finances@gabrielsilva.dev. Alguns pedidos podem exigir verificação de identidade.
    p11: >-
      Os documentos legais estão disponíveis em inglês e português (Brasil). Se houver divergências,
      buscamos manter o alinhamento; a versão registrada no cadastro é definida pelo servidor.
    p12: >-
      Quando o Cloudflare Turnstile estiver habilitado, ele pode processar dados técnicos limitados
      durante desafios interativos em telas relacionadas à autenticação para reduzir abuso automatizado;
      consulte os avisos da Cloudflare sobre o Turnstile.
