plans:
  navLink: Plans
  eyebrow: Current allowances
  title: Plans and limits, in plain sight
  intro: >-
    These are the limits this public Shared Finances instance enforces right now. They come from the
    same stored settings used when the application accepts or refuses an action.
  loading: Loading the current limits…
  loadError: The current plan comparison could not be loaded.
  quota: What is limited
  unlimited: Unlimited
  actions:
    startNow: Start now
    comingSoon: Coming soon
  selfHosted:
    name: Self-hosted
    youDefine: You decide
  userPlans:
    eyebrow: Per account
    title: User plans
    description: These allowances belong to one user account, regardless of the groups it joins.
  groupTiers:
    eyebrow: Per owned group
    title: Group tiers
    description: >-
      Group allowances are separate from user allowances. A group’s tier follows the plan of the
      member who owns that group.
  inactivity:
    finite: An unused account on this plan may be deleted after {{months}} months, with advance notice by e-mail.
    unlimited: Accounts on this plan have no configured inactivity-retention limit.
  openSource:
    eyebrow: Run it your way
    title: Open source, without hosted-instance limits
    description: >-
      These limits help cover the cost of operating this public instance. Shared Finances is open
      source, and an instance you host yourself is not subject to them.
    link: ynixt/shared-finances
